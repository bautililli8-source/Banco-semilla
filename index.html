<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Banco de Semillas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Courier+Prime:wght@400;700&display=swap">
<style id="app-style">/* Fichero de semillas: fichas de catálogo por especie con índice A–Z tipo pestañas de cajón; barra inferior de secciones para el pulgar. */
:root{
  --papel:#ECEFE6; --ficha:#FBFCF7; --tinta:#1D2A20; --tenue:#5B6A5E; --linea:#D3D9CB;
  --verde:#2E5E3E; --sobre-verde:#FBFCF7; --verde-suave:#DCE8DD; --maiz:#9C7210; --maiz-suave:#F3E7C4;
  --ok:#2F7A4C; --ok-suave:#DCEFE2; --alerta:#9A5F06; --alerta-suave:#F7E8CB; --mal:#B0412C; --mal-suave:#F6DDD6;
  --velo:rgba(29,42,32,.42);
  --sombra:0 1px 0 rgba(29,42,32,.05), 0 8px 22px -16px rgba(29,42,32,.45);
  --qr-fondo:#FFFFFF; --qr-tinta:#000000;
  --f-titulo:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-dato:"Courier Prime",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#111712; --ficha:#18211A; --tinta:#E4EBE0; --tenue:#9AA89B; --linea:#2D392F;
    --verde:#86C59A; --sobre-verde:#0F1C13; --verde-suave:#1F3325; --maiz:#E3B547; --maiz-suave:#3A3016;
    --ok:#74C892; --ok-suave:#1C3324; --alerta:#E7AE52; --alerta-suave:#3A2C14; --mal:#EE8A73; --mal-suave:#3D201A;
    --velo:rgba(0,0,0,.6); --sombra:0 1px 0 rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papel:#111712; --ficha:#18211A; --tinta:#E4EBE0; --tenue:#9AA89B; --linea:#2D392F;
  --verde:#86C59A; --sobre-verde:#0F1C13; --verde-suave:#1F3325; --maiz:#E3B547; --maiz-suave:#3A3016;
  --ok:#74C892; --ok-suave:#1C3324; --alerta:#E7AE52; --alerta-suave:#3A2C14; --mal:#EE8A73; --mal-suave:#3D201A;
  --velo:rgba(0,0,0,.6); --sombra:0 1px 0 rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}

/* encabezado */
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-bottom:14px;border-bottom:1px solid var(--linea);margin-bottom:16px}
.cab-esc{font-family:var(--f-dato);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.cab h1{font-family:var(--f-titulo);font-weight:800;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1;margin:.15em 0 0;letter-spacing:-.02em;text-wrap:balance}
.cab h1 span{color:var(--verde)}
.cab-datos{font-family:var(--f-dato);font-size:.85rem;color:var(--tenue);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.cab-datos b{color:var(--tinta);font-weight:700}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ficha);border-top:1px solid var(--linea);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:620px;margin:0 auto;display:flex;justify-content:space-around;gap:2px}
.nav button{flex:1 1 0;min-width:0;background:none;border:0;border-radius:10px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tenue);font-size:.72rem;line-height:1.15;cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--verde);background:var(--verde-suave);font-weight:700}

/* tipografía y bloques */
.h2{font-family:var(--f-titulo);font-weight:750;font-size:1.45rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.h3{font-family:var(--f-titulo);font-weight:700;font-size:1.12rem;margin:0;line-height:1.2}
.nota{color:var(--tenue);margin:0 0 14px;max-width:62ch}
.mono{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.sci{font-style:italic}
.vacio{padding:28px 16px;text-align:center;color:var(--tenue);border:1px dashed var(--linea);border-radius:8px}
.stack{display:flex;flex-direction:column;gap:14px}

/* herramientas del banco */
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.buscar{flex:1 1 240px;min-width:0;position:relative}
.buscar input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--linea);border-radius:10px;background:var(--ficha)}
.buscar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--tenue);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linea);background:var(--ficha);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;color:var(--tenue)}
.chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde)}
.vista{display:inline-flex;border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--ficha)}
.vista button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--tenue);font-size:.9rem}
.vista button[aria-pressed="true"]{background:var(--verde-suave);color:var(--verde);font-weight:700}

/* índice A–Z */
.indice{display:flex;gap:4px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px;scrollbar-width:thin}
.indice button{flex:0 0 auto;width:30px;height:32px;border:1px solid var(--linea);border-bottom-width:3px;border-radius:7px 7px 3px 3px;background:var(--ficha);font-family:var(--f-dato);font-weight:700;cursor:pointer;color:var(--tinta)}
.indice button:disabled{opacity:.35;cursor:default}

/* fichas */
.letra{display:flex;align-items:center;gap:10px;margin:18px 0 8px;scroll-margin-top:12px}
.letra b{font-family:var(--f-titulo);font-size:1.35rem;font-weight:800;width:38px;height:34px;display:grid;place-items:center;background:var(--maiz-suave);color:var(--maiz);border-radius:8px 8px 2px 2px}
.letra::after{content:"";flex:1;height:1px;background:var(--linea)}
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ficha{position:relative;background:var(--ficha);border:1px solid var(--linea);border-radius:6px;padding:12px 14px 20px;box-shadow:var(--sombra);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.ficha:hover{border-color:var(--verde)}
.ficha::after{content:"";position:absolute;left:50%;bottom:6px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--papel);border:1px solid var(--linea)}
.ficha-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--maiz)}
.especie{font-family:var(--f-titulo);font-weight:750;font-size:1.18rem;line-height:1.15}
.variedad{color:var(--tenue);font-size:.92rem}
.ficha .sci{color:var(--tenue);font-size:.9rem}
.ficha-res{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ficha-res .mono{font-size:1.05rem;font-weight:700}
.lotes{display:flex;flex-wrap:wrap;gap:6px}
.lote-chip{font-family:var(--f-dato);font-size:.8rem;border:1px solid var(--linea);border-radius:4px;padding:2px 7px;color:var(--tenue);font-variant-numeric:tabular-nums}
.lote-chip b{color:var(--tinta)}
.lote-chip.agot{text-decoration:line-through;opacity:.6}

/* píldoras de estado */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;font-family:var(--f-dato);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-suave);color:var(--ok)}
.pill.alerta{background:var(--alerta-suave);color:var(--alerta)}
.pill.mal{background:var(--mal-suave);color:var(--mal)}
.pill.s{background:var(--verde-suave);color:var(--tenue)}
.etq{display:inline-block;font-size:.78rem;border-radius:4px;padding:1px 7px;font-weight:700}
.etq.alerta{background:var(--alerta-suave);color:var(--alerta)}
.etq.mal{background:var(--mal-suave);color:var(--mal)}
.etq.info{background:var(--verde-suave);color:var(--verde)}

/* planilla */
.tabla-caja{overflow-x:auto;border:1px solid var(--linea);border-radius:8px;background:var(--ficha)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-family:var(--f-dato);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);background:var(--papel);position:sticky;top:0}
td.num,th.num{text-align:right;font-family:var(--f-dato);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--verde-suave)}
tbody tr:last-child td{border-bottom:0}

/* paneles y formularios */
.panel{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:16px;box-shadow:var(--sombra)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--linea);border-radius:12px;overflow:hidden;margin:4px 0 16px;background:var(--papel)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:12px 8px;text-align:center;cursor:pointer;font-weight:700;color:var(--tenue)}
.seg input:checked+label{background:var(--verde);color:var(--sobre-verde)}
.seg input:focus-visible+label{outline:2px solid var(--verde);outline-offset:-4px}
.seg.tres{grid-template-columns:repeat(3,1fr)}
.seg.tres label{font-size:.9rem}
form{display:flex;flex-direction:column;gap:12px}
.fila2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;margin:0;padding:0}
.campo>span,.campo>legend{font-size:.88rem;font-weight:700;color:var(--tenue)}
.campo legend{margin-bottom:6px;padding:0}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:8px;background:var(--papel);min-width:0}
.campo textarea{min-height:110px;resize:vertical;font-family:var(--f-dato);font-size:.85rem}
.op{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--linea);border-radius:8px;cursor:pointer;background:var(--papel)}
.op+.op{margin-top:6px}
.op input{margin-top:4px;accent-color:var(--verde)}
.op small{display:block;color:var(--tenue)}
.btn{border:1px solid var(--linea);background:var(--ficha);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.prim{background:var(--verde);border-color:var(--verde);color:var(--sobre-verde);padding:13px 18px;font-size:1.02rem}
.btn.peligro{color:var(--mal);border-color:var(--mal)}
.btn.chico{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--mal);font-weight:700;font-size:.92rem}
.err:empty{display:none}

/* vista previa didáctica */
.prev{border:1px dashed var(--verde);border-radius:10px;padding:12px 14px;background:var(--verde-suave);display:flex;flex-direction:column;gap:8px}
.prev:empty{display:none}
.prev p{margin:0}
.formula{font-family:var(--f-dato);font-size:.88rem;background:var(--ficha);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.flecha{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-dato);font-weight:700}
.flecha .de,.flecha .a{padding:3px 9px;border-radius:6px;background:var(--ficha)}
.delta.mas{color:var(--ok)} .delta.menos{color:var(--mal)} .delta.igual{color:var(--tenue)}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;background:var(--maiz-suave);border-radius:8px}
.calc label{font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calc input{width:90px;padding:7px 9px;border:1px solid var(--linea);border-radius:6px;background:var(--ficha)}
.calc output{font-size:.92rem}

/* movimientos */
.mov{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:0}
.mov-tipo{grid-row:span 2;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-dato);font-weight:700;font-size:.8rem}
.t-salida{background:var(--maiz-suave);color:var(--maiz)}
.t-devolucion{background:var(--ok-suave);color:var(--ok)}
.t-ingreso{background:var(--verde-suave);color:var(--verde)}
.t-ensayo{background:var(--verde-suave);color:var(--tinta)}
.t-baja{background:var(--mal-suave);color:var(--mal)}
.mov-l1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0}
.mov-l1 strong{font-weight:700}
.mov-l2{color:var(--tenue);font-size:.9rem;display:flex;flex-wrap:wrap;gap:2px 12px;min-width:0}
.mov-acc{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fecha{font-family:var(--f-dato);font-size:.8rem;color:var(--tenue)}
.lista{background:var(--ficha);border:1px solid var(--linea);border-radius:10px;padding:2px 14px}
details.alumno{border-bottom:1px solid var(--linea)}
details.alumno:last-child{border-bottom:0}
details.alumno summary{cursor:pointer;padding:11px 0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;list-style:none}
details.alumno summary::-webkit-details-marker{display:none}
details.alumno summary::before{content:"+";font-family:var(--f-dato);font-weight:700;color:var(--verde);width:14px}
details.alumno[open] summary::before{content:"−"}

/* gestión */
details.sec{background:var(--ficha);border:1px solid var(--linea);border-radius:10px}
details.sec>summary{cursor:pointer;padding:14px 16px;font-family:var(--f-titulo);font-weight:700;font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--f-dato);color:var(--verde);font-size:1.2rem}
details.sec[open]>summary::after{content:"−"}
details.sec>.sec-in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.sec-in p{margin:0}
.qr-caja{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qr{background:var(--qr-fondo);padding:10px;border-radius:8px;width:180px;max-width:100%;border:1px solid var(--linea)}
.qr svg{display:block;width:100%;height:auto}
.url{font-family:var(--f-dato);font-size:.82rem;word-break:break-all;background:var(--papel);padding:6px 8px;border-radius:6px;user-select:all}

/* hoja de detalle */
.velo{position:fixed;inset:0;background:var(--velo);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--papel);width:100%;max-width:720px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px -20px rgba(0,0,0,.5)}
@media (min-width:760px){.velo{align-items:center}.hoja{border-radius:14px;max-height:86%}}
.hoja-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
.cerrar{border:1px solid var(--linea);background:var(--ficha);border-radius:50%;width:38px;height:38px;flex:0 0 auto;cursor:pointer;font-size:1.2rem;line-height:1}
.dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.92rem;margin:0 0 12px}
.dl dt{color:var(--tenue)} .dl dd{margin:0}
.lote{background:var(--ficha);border:1px solid var(--linea);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lote-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lote-anio{font-family:var(--f-titulo);font-weight:800;font-size:1.3rem}
.medidor{height:8px;background:var(--verde-suave);border-radius:4px;position:relative;overflow:visible}
.medidor i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--verde)}
.medidor.alerta i{background:var(--alerta)} .medidor.mal i{background:var(--mal)}
.medidor u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tinta);opacity:.35}
.lote-pie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:.88rem;color:var(--tenue)}
.spark{display:block}

/* aprendé */
.art{max-width:68ch;display:flex;flex-direction:column;gap:14px}
.art h3{font-family:var(--f-titulo);font-size:1.18rem;margin:6px 0 0}
.art p,.art ol,.art ul{margin:0}
.art li+li{margin-top:4px}
.art table{min-width:0}
.caja-f{background:var(--ficha);border:1px solid var(--linea);border-radius:8px;padding:12px 14px}

/* avisos */
.aviso{border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--linea);background:var(--ficha)}
.aviso.alerta{background:var(--alerta-suave);border-color:var(--alerta)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:10px;z-index:60;max-width:min(92vw,520px);font-size:.95rem;box-shadow:var(--sombra)}
.ocupado{position:fixed;inset:0;z-index:70;background:var(--velo);display:grid;place-items:center}
.ocupado div{background:var(--ficha);padding:18px 22px;border-radius:12px;font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .hoja{animation:sube .22s ease-out}
  @keyframes sube{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var nf1 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 1 });
var nf0 = new Intl.NumberFormat('es-AR', { maximumFractionDigits: 0 });
function r1(x){ return Math.round(x * 10) / 10; }
function fPG(p){ return (p == null || isNaN(p)) ? 's/d' : nf1.format(r1(p)) + ' %'; }
function fCant(c, u){
  c = +c || 0;
  if (u === 'g'){ return Math.abs(c) >= 1000 ? nf1.format(r1(c / 1000)) + ' kg' : nf1.format(r1(c)) + ' g'; }
  return nf0.format(c) + ' ' + (u || '');
}
function fFecha(t){ try { return new Date(t).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' }); } catch(e){ return ''; } }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function sinTilde(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function norm(s){ return sinTilde(s).toLowerCase().replace(/\s+/g, ' ').trim(); }
function letra(s){ var l = sinTilde(s).trim().charAt(0).toUpperCase(); return /[A-Z]/.test(l) ? l : '#'; }
function clon(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ if (v === '' || v == null) return NaN; return parseFloat(String(v).replace(',', '.')); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch(e){ return null; } }
function ss(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){ return null; } }
function cmpVar(a, b){ var x = a.especie.localeCompare(b.especie, 'es', { sensitivity: 'base' }); return x || String(a.variedad || '').localeCompare(String(b.variedad || ''), 'es', { sensitivity: 'base' }); }
function cmpMov(a, b){ return a.t < b.t ? -1 : a.t > b.t ? 1 : (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); }
function nombreVar(v){ return v ? v.especie + (v.variedad ? ' ' + v.variedad : '') : '(variedad borrada)'; }
function nivel(pg){ return pg == null ? 's' : pg >= 80 ? 'ok' : pg >= 60 ? 'alerta' : 'mal'; }
function anioTxt(a){ return +a ? String(a) : 's/f'; }
function edadTxt(a){ if (!+a) return 'edad desconocida'; var e = ANIO - a; return e + (e === 1 ? ' año' : ' años'); }
var NIVEL_TXT = { ok: 'Bueno', alerta: 'Regular', mal: 'Bajo', s: 'Sin dato' };
var TIPO_TXT = { salida: 'Salida', devolucion: 'Devolución', ingreso: 'Ingreso', ensayo: 'Ensayo', baja: 'Baja' };
var TIPO_COD = { salida: 'SAL', devolucion: 'DEV', ingreso: 'ING', ensayo: 'ENS', baja: 'BAJ' };

/* ===== cálculo del banco ===== */
function calcular(){
  var vars = {}; ST.variedades.forEach(function(v){ vars[v.id] = v; });
  var lotes = {}, salidas = {}, efecto = {}, pesadas = {}, salSP = {};
  var ms = ST.movs.slice().sort(cmpMov);
  ms.forEach(function(m){ if (m.tipo === 'salida' && m.sinPesar) salSP[m.id] = 1; });
  ms.forEach(function(m){
    if (m.tipo === 'salida' && m.sinPesar){
      /* salida de un envase todavía sin pesar: queda como préstamo pero no descuenta existencias */
      efecto[m.id] = { sA: null, sD: null, pA: null, pD: null };
      salidas[m.id] = { m: m, devuelto: 0, devs: [] };
      return;
    }
    if (m.tipo === 'devolucion' && m.tipoSem === 'sinusar' && salSP[m.salidaId] && !pesadas[m.vid]){
      /* vuelve al envase sin pesar: se cuenta cuando el docente lo pese */
      efecto[m.id] = { sA: null, sD: null, pA: null, pD: null };
      return;
    }
    if (m.tipo === 'ingreso') pesadas[m.vid] = true;
    var k = m.vid + '|' + m.anio;
    var L = lotes[k];
    if (!L){ L = lotes[k] = { key: k, vid: m.vid, anio: +m.anio, stock: 0, pg: null, hist: [], movs: [], ultEnsayo: null }; }
    L.movs.push(m);
    var c = +m.cant || 0, antesS = L.stock, antesP = L.pg;
    if (m.tipo === 'ingreso' || m.tipo === 'devolucion'){
      var pin = (m.pg === null || m.pg === undefined || m.pg === '') ? null : +m.pg;
      var prev = Math.max(0, L.stock);
      if (pin !== null){ L.pg = (prev <= 0 || L.pg === null) ? pin : (prev * L.pg + c * pin) / (prev + c); }
      L.stock = L.stock + c;
      if (m.pgFuente === 'ensayo') L.ultEnsayo = m.t;
    } else if (m.tipo === 'salida' || m.tipo === 'baja'){
      L.stock = L.stock - c;
    } else if (m.tipo === 'ensayo'){
      L.pg = +m.pg; L.ultEnsayo = m.t;
    }
    efecto[m.id] = { sA: antesS, sD: L.stock, pA: antesP, pD: L.pg };
    L.hist.push({ t: m.t, pg: L.pg, stock: L.stock, tipo: m.tipo });
    if (m.tipo === 'salida') salidas[m.id] = { m: m, devuelto: 0, devs: [] };
  });
  ms.forEach(function(m){
    if (m.tipo === 'devolucion' && m.salidaId && salidas[m.salidaId]){
      var s = salidas[m.salidaId]; s.devuelto += +m.cant || 0; s.devs.push(m);
    }
  });
  CALC = { vars: vars, lotes: lotes, salidas: salidas, efecto: efecto, ms: ms, pesadas: pesadas };
}
function lotesDe(vid, todos){
  var out = [];
  for (var k in CALC.lotes){ var L = CALC.lotes[k]; if (L.vid === vid && (todos || L.stock > 0)) out.push(L); }
  return out.sort(function(a, b){ return b.anio - a.anio; });
}
function resumen(vid){
  var ls_ = lotesDe(vid), tot = 0, suma = 0, conPg = 0;
  ls_.forEach(function(L){ tot += L.stock; if (L.pg != null){ suma += L.stock * L.pg; conPg += L.stock; } });
  return { total: tot, pg: conPg > 0 ? suma / conPg : null, lotes: ls_ };
}
function sinPesar(v){ return !!(v && v.envases) && !CALC.pesadas[v.id]; }
function sePuedeLlevar(v){ return resumen(v.id).total > 0 || sinPesar(v); }
function pendientes(){
  var out = [];
  for (var k in CALC.salidas){ var s = CALC.salidas[k]; if (!s.m.cerrada && s.devuelto < (+s.m.cant || 0)) out.push(s); }
  return out.sort(function(a, b){ return cmpMov(a.m, b.m); });
}
function avisosLote(L, v){
  var out = [], edad = ANIO - L.anio;
  if (!+L.anio) out.push(['info', 'Año de cosecha desconocido']);
  else if (v && v.vida && edad > v.vida) out.push(['alerta', 'Supera su vida útil (' + v.vida + ' años)']);
  if (L.pg == null) out.push(['alerta', 'Falta ensayo de germinación']);
  else if (!L.ultEnsayo) out.push(['info', 'Sin ensayo propio']);
  else {
    var meses = (Date.now() - new Date(L.ultEnsayo).getTime()) / 2629800000;
    if (meses >= 12) out.push(['alerta', 'Último ensayo hace más de 1 año']);
  }
  if (L.pg != null && L.pg < 60) out.push(['mal', 'Conviene renovar']);
  return out;
}

function construirHTML(st){
  var css = document.getElementById('app-style').textContent;
  var code = document.getElementById('app-code').textContent;
  var json = JSON.stringify(st).replace(/</g, '\\u003c');
  return HEAD_HTML + TOP_HTML + '<style id="app-style">' + css + '</style>\n<div id="app"></div>\n<script id="estado" type="application/json">' + json + '<\/script>\n<script id="app-code">' + code + '<\/script>\n</body></html>';
}
function aplicar(st, p){
  var ids;
  if (p.op === 'addMovs'){
    ids = {}; st.movs.forEach(function(m){ ids[m.id] = 1; });
    p.movs.forEach(function(m){ if (!ids[m.id]) st.movs.push(m); });
  } else if (p.op === 'delMov'){
    st.movs = st.movs.filter(function(m){ return m.id !== p.id; });
  } else if (p.op === 'updMov'){
    st.movs.forEach(function(m){ if (m.id === p.id) Object.keys(p.campos).forEach(function(k){ m[k] = p.campos[k]; }); });
  } else if (p.op === 'setVar'){
    var i = st.variedades.findIndex(function(v){ return v.id === p.v.id; });
    if (i >= 0) st.variedades[i] = p.v; else st.variedades.push(p.v);
  } else if (p.op === 'delVar'){
    st.variedades = st.variedades.filter(function(v){ return v.id !== p.id; });
  } else if (p.op === 'config'){
    Object.keys(p.c).forEach(function(k){ st.config[k] = p.c[k]; });
  } else if (p.op === 'delEjemplos'){
    st.movs = st.movs.filter(function(m){ return !m.ej; });
    var usadas = {}; st.movs.forEach(function(m){ usadas[m.vid] = 1; });
    st.variedades = st.variedades.filter(function(v){ return !v.ej || usadas[v.id]; });
    st.variedades.forEach(function(v){ delete v.ej; });
  }
  return st;
}
var reintentado = false;
function guardar(patch, desc, alGuardar, alFallar){
  if (API) return guardarAPI(patch, desc, alGuardar, alFallar);
  patch.pid = uid('p');
  var nuevo = aplicar(clon(ST), clon(patch));
  nuevo.ultimoCambio = patch.pid;
  ss('bs_pend', JSON.stringify({ patch: patch, desc: desc }));
  ocupado(true);
  return ART.publish(construirHTML(nuevo)).then(function(){
    ocupado(false); toast('Guardado: ' + desc);
  }, function(e){
    var c = e && e.code;
    if (c === 'conflict'){ toast('Alguien guardó al mismo tiempo. La página se actualiza…'); return; }
    ss('bs_pend', null); ocupado(false);
    if (c === 'upstream_error' && !reintentado){ reintentado = true; setTimeout(function(){ guardar(patch, desc); }, 800 + Math.random() * 900); return; }
    if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed'){
      puedeGuardar = false; esDocente = false; pintar(); toast('Esta vista es de solo lectura. Usá «Enviar al docente».'); return;
    }
    if (c === 'rate_limited'){ toast('Se guardaron muchos cambios seguidos. Esperá unos segundos y probá de nuevo.'); return; }
    if (c === 'too_large'){ toast('El registro llegó al tamaño máximo. Exportá la planilla y borrá movimientos viejos.'); return; }
    toast('No se pudo guardar. Probá de nuevo en un momento.');
  });
}
function revisarPendiente(){
  var raw = ss('bs_pend'); if (!raw) return null;
  var p; try { p = JSON.parse(raw); } catch(e){ ss('bs_pend', null); return null; }
  if (ST.ultimoCambio === p.patch.pid){ ss('bs_pend', null); setTimeout(function(){ toast('Guardado: ' + p.desc); }, 300); return null; }
  return p;
}

var API = '';
var PLANILLA = 'https://docs.google.com/spreadsheets/d/1vCNJ68T7k5-Fvmm-BcT-DSVqVU8_d5nIhtEY2Dw7c9w/edit';
var CLAVE = '', RED = '';
function api(pedido){
  return fetch(API, { method: 'POST', body: JSON.stringify(pedido) }).then(function(r){ return r.json(); });
}
function aplicarEstado(e){
  if (!e) return;
  ST.variedades = e.variedades || []; ST.movs = e.movs || [];
  if (e.config){ if (e.config.escuela) ST.config.escuela = e.config.escuela; if (e.config.wa) ST.config.wa = e.config.wa; }
}
function cargarEstado(){
  return fetch(API + '?accion=estado&_=' + Date.now()).then(function(r){ return r.json(); }).then(function(r){
    if (!r || !r.ok) throw new Error((r && r.error) || 'sin datos');
    aplicarEstado(r.estado); RED = 'ok'; return true;
  }).catch(function(){ RED = 'sin'; return false; });
}
function iniciarAPI(){
  var clave = ls('bs_clave') || '';
  return cargarEstado().then(function(hay){
    puedeGuardar = hay;
    if (!hay || !clave) return;
    return api({ op: 'verificar', clave: clave }).then(function(r){
      if (r && r.ok){ CLAVE = clave; esDocente = true; } else ls('bs_clave', '');
    }, function(){});
  });
}
function guardarAPI(patch, desc, alGuardar, alFallar){
  var pedido = clon(patch); if (CLAVE) pedido.clave = CLAVE;
  ocupado(true);
  return api(pedido).then(function(r){
    ocupado(false);
    if (!r || !r.ok){ var e = (r && r.error) || 'La planilla no respondió.'; if (alFallar) alFallar(e); else toast(e); return; }
    aplicarEstado(r.estado); RED = 'ok'; cerrarHoja(); pintar(); toast('Guardado: ' + desc);
    if (alGuardar) alGuardar();
  }, function(){
    ocupado(false);
    var e = 'No hay conexión con la planilla.';
    if (alFallar) alFallar(e); else toast(e + ' Probá de nuevo en un momento.');
  });
}
function htmlAcceso(){
  return '<div class="btns">' + (esDocente
    ? '<button class="btn chico" type="button" id="b-salir">Salir del modo docente</button>'
    : '<button class="btn chico" type="button" id="b-docente">Soy docente</button>') + '</div>';
}
function enlazarAcceso(){
  var bd = $('#b-docente'), bs = $('#b-salir');
  if (bd) bd.onclick = abrirIngreso;
  if (bs) bs.onclick = function(){ CLAVE = ''; ls('bs_clave', ''); esDocente = false; UI.tab = 'banco'; pintar(); toast('Saliste del modo docente'); };
}
function abrirIngreso(){
  hoja('<div class="hoja-cab"><div><div class="especie" style="font-size:1.4rem">Entrar como docente</div></div><button class="cerrar" type="button" aria-label="Cerrar">×</button></div>' +
    '<form id="f-clave" class="stack" novalidate><label class="campo"><span>Clave de docente</span><input id="k-clave" type="password" autocomplete="current-password"></label>' +
    '<p class="nota" style="margin:0">Es la clave que escribiste en la pestaña Config de la planilla de Google.</p>' +
    '<div class="err" id="k-err" role="alert"></div><button class="btn prim" type="submit" id="k-ok">Entrar</button></form>', function(box){
    $('#f-clave', box).onsubmit = function(ev){
      ev.preventDefault();

        CLAVE = c; ls('bs_clave', c); esDocente = true; cerrarHoja(); irA('docente'); toast('Entraste como docente');
      }, function(){ b.disabled = false; er.textContent = 'No hay conexión con la planilla. Probá de nuevo.'; });

  });

function b64(s){ var b = new TextEncoder().encode(s), t = ''; for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]); return btoa(t); }
function deb64(s){ var t = atob(s), b = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return new TextDecoder().decode(b); }
function codigo(m){ return 'BS1.' + b64(JSON.stringify(m)); }
function leerCodigos(txt){
  var out = [], re = /BS1\.([A-Za-z0-9+\/=]+)/g, x;
  while ((x = re.exec(txt))){ try { out.push({ m: JSON.parse(deb64(x[1])) }); } catch(e){ out.push({ err: 'Código dañado o incompleto' }); } }
  return out;
}
function textoMov(m, sinCodigo){
  var v = CALC.vars[m.vid], u = v ? v.unidad : '';
  var l = ['Banco de Semillas: ' + (m.tipo === 'salida' ? 'SALIDA' : 'DEVOLUCIÓN'),
    'Alumno/a: ' + m.alumno + (m.curso ? ' (' + m.curso + ')' : ''),
    'Semilla: ' + nombreVar(v) + (v && v.cientifico ? ' (' + v.cientifico + ')' : '') + ', ' + (m.sinPesar ? 'envase sin pesar' : 'lote ' + anioTxt(m.anio)),
    'Cantidad: ' + fCant(m.cant, u) + (m.sinPesar ? ' aprox.' : '') + ' · PG ' + fPG(m.pg) + (m.pgFuente === 'estimado' ? ' (estimado)' : '')];
  if (m.destino) l.push('Destino: ' + m.destino);
  if (m.obs) l.push('Obs.: ' + m.obs);
  if (!sinCodigo) l.push('', 'Código para cargar:', codigo(m));
  return l.join('\n');
}

/* ===== detalle de una variedad ===== */
function spark(hist){
  var p = hist.filter(function(h){ return h.pg != null; });
  if (p.length < 2) return '';
  var w = 132, h = 38, n = p.length;
  var pts = p.map(function(e, i){ return [6 + i * (w - 12) / (n - 1), 4 + (1 - e.pg / 100) * (h - 8)]; });
  var y80 = 4 + 0.2 * (h - 8);
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Evolución del PG del lote">' +
    '<line x1="0" x2="' + w + '" y1="' + y80 + '" y2="' + y80 + '" style="stroke:var(--linea)" stroke-dasharray="3 3"/>' +
    '<polyline points="' + pts.map(function(q){ return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '" style="fill:none;stroke:var(--verde)" stroke-width="2" stroke-linejoin="round"/>' +
    '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="3.5" style="fill:var(--verde)"/></svg>';
}

function prevDev(){

function enlazarDocente(){

      var m = r.m;

    }).join('') + '</div>' + (leidos.length ? '<button class="btn prim" type="button" id="g-comp-ok">Cargar ' + leidos.length + ' movimiento' + (leidos.length > 1 ? 's' : '') + '</button>' : '');

    if (isNaN(c) || c <= 0){ er.textContent = 'Indicá la cantidad.'; return; }

  };
  // ensayo

  function prevEns(){
    var es = num($('#ge-es').value), ge = num($('#ge-ge').value), L = CALC.lotes[geVar.value + '|' + geLote.value], o = $('#ge-prev');

  }
  if (geVar.value) lotesOpts(geLote, geVar.value, false);
  geVar.onchange = function(){ lotesOpts(geLote, geVar.value, false); prevEns(); };
  geLote.onchange = prevEns; $('#ge-es').oninput = prevEns; $('#ge-ge').oninput = prevEns;
  $('#g-ens').onsubmit = function(e){
    e.preventDefault(); var er = $('#ge-err'); er.textContent = '';
    var es = num($('#ge-es').value), ge = num($('#ge-ge').value);
    if (!geLote.value){ er.textContent = 'Esa variedad no tiene lotes.'; return; }
    if (isNaN(es) || es <= 0 || isNaN(ge) || ge < 0){ er.textContent = 'Completá puestas y germinadas.'; return; }
    if (ge > es){ er.textContent = 'Germinadas no puede superar a puestas.'; return; }
    guardar({ op: 'addMovs', movs: [{ id: uid('m'), t: new Date().toISOString(), tipo: 'ensayo', vid: geVar.value, anio: +geLote.value, cant: 0, pg: r1(ge / es * 100), pgFuente: 'ensayo', es: es, ge: ge, obs: $('#ge-obs').value.trim() }] }, 'ensayo de ' + nombreVar(CALC.vars[geVar.value]) + ' ' + anioTxt(+geLote.value));
  };
  // baja
  var gbVar = $('#gb-var'), gbLote = $('#gb-lote');
  if (gbVar.value) lotesOpts(gbLote, gbVar.value, true);
  gbVar.onchange = function(){ lotesOpts(gbLote, gbVar.value, true); };
  $('#g-baja').onsubmit = function(e){
    e.preventDefault(); var er = $('#gb-err'); er.textContent = '';
    var L = CALC.lotes[gbVar.value + '|' + gbLote.value], c = num($('#gb-cant').value);
    if (!L){ er.textContent = 'Elegí un lote.'; return; }
    if (isNaN(c) || c <= 0 || c > L.stock){ er.textContent = 'La cantidad tiene que estar entre 0 y ' + fCant(L.stock, CALC.vars[L.vid].unidad) + '.'; return; }
    guardar({ op: 'addMovs', movs: [{ id: uid('m'), t: new Date().toISOString(), tipo: 'baja', vid: L.vid, anio: L.anio, cant: c, obs: $('#gb-mot').value }] }, 'baja de ' + nombreVar(CALC.vars[L.vid]) + ' ' + anioTxt(L.anio));
  };
  // variedades
  var gvSel = $('#gv-sel'), gvDel = $('#gv-del');

    $('#gv-gru').value = v.grupo || ''; $('#gv-uni').value = v.unidad || 'g'; $('#gv-vida').value = v.vida || ''; $('#gv-not').value = v.notas || ''; $('#gv-env').value = v.envases || '';
    gvDel.hidden = !v.id; gvDel.dataset.conf = ''; gvDel.textContent = 'Borrar ficha';
    $('#gv-ok').textContent = v.id ? 'Guardar cambios' : 'Crear variedad';
  }
  gvSel.onchange = cargarFicha; cargarFicha();
  if (UI.preVar){ $('#sec-var').open = true; UI.secAbierta = 'var'; UI.preVar = null; setTimeout(function(){ $('#sec-var').scrollIntoView({ block: 'start' }); }, 50); }
  $('#g-var').onsubmit = function(e){

    var esp = $('#gv-esp').value.trim();
    if (!esp){ er.textContent = 'Escribí el nombre de la especie.'; return; }
    var old = CALC.vars[gvSel.value];
    var v = { id: old ? old.id : uid('v'), especie: esp, variedad: $('#gv-var').value.trim(), cientifico: $('#gv-sci').value.trim(), familia: $('#gv-fam').value.trim(),
      grupo: $('#gv-gru').value.trim(), unidad: $('#gv-uni').value, vida: parseInt($('#gv-vida').value, 10) || null, notas: $('#gv-not').value.trim(), envases: $('#gv-env').value.trim() };
    if (old && old.ej) v.ej = true;
    guardar({ op: 'setVar', v: v }, (old ? 'cambios en ' : 'nueva variedad ') + nombreVar(v));
  };
  gvDel.onclick = function(){
    var vid = gvSel.value, usada = ST.movs.some(function(m){ return m.vid === vid; });
    if (usada){ $('#gv-err').textContent = 'Esta variedad tiene movimientos. Anulalos primero o dejala sin existencias.'; return; }

  };

  var uc = $('#g-url-c'); if (uc) uc.onclick = function(){ copiar(ST.config.url, $('#g-url')); };
  var gc = $('#g-cartel'); if (gc) gc.onclick = function(){ descargar('cartel-banco-de-semillas.svg', cartelSVG()); };
  // exportar
  $('#g-exp-inv').onclick = function(){ descargar('inventario-banco-semillas.csv', '﻿' + csvInventario()); };
  $('#g-exp-mov').onclick = function(){ descargar('movimientos-banco-semillas.csv', '﻿' + csvMovs()); };
  // ajustes
  $('#g-aj').onsubmit = function(e){ e.preventDefault(); guardar({ op: 'config', c: { escuela: $('#ga-esc').value.trim(), wa: $('#ga-wa').value.replace(/\D/g, '') } }, 'ajustes'); };
  var ej = $('#g-ej'); if (ej) ej.onclick = function(){
    if (ej.dataset.conf !== '1'){ ej.dataset.conf = '1'; ej.textContent = '¿Seguro? Tocá para borrar'; return; }
    guardar({ op: 'delEjemplos' }, 'borrar datos de ejemplo');
  };

/* ===== exportar y descargar ===== */
function celda(x){ x = x == null ? '' : String(x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
function dec(x){ return x == null || isNaN(x) ? '' : String(r1(x)).replace('.', ','); }
function csvInventario(){
  var f = [['Especie', 'Variedad', 'Nombre científico', 'Familia', 'Grupo', 'Envases', 'Año de cosecha', 'Edad (años)', 'Cantidad', 'Unidad', 'PG actual (%)', 'Estado', 'Último ensayo']];
  ST.variedades.slice().sort(cmpVar).forEach(function(v){
    var ls_ = lotesDe(v.id);
    if (!ls_.length) f.push([v.especie, v.variedad, v.cientifico, v.familia, v.grupo, v.envases, '', '', '', v.unidad, '', sinPesar(v) ? 'Sin pesar' : 'Sin existencias', '']);
    ls_.forEach(function(L){
      f.push([v.especie, v.variedad, v.cientifico, v.familia, v.grupo, v.envases, anioTxt(L.anio), +L.anio ? ANIO - L.anio : '', dec(L.stock), v.unidad, dec(L.pg), NIVEL_TXT[nivel(L.pg)], L.ultEnsayo ? fFecha(L.ultEnsayo) : '']);
    });
  });
  return f.map(function(r){ return r.map(celda).join(';'); }).join('\r\n');
}
function csvMovs(){
  var f = [['Fecha', 'Tipo', 'Alumno', 'Curso', 'Especie', 'Variedad', 'Año del lote', 'Cantidad', 'Unidad', 'PG (%)', 'Origen del PG', 'Destino', 'Observaciones']];
  CALC.ms.forEach(function(m){
    var v = CALC.vars[m.vid] || {};
    f.push([new Date(m.t).toLocaleDateString('es-AR'), TIPO_TXT[m.tipo], m.alumno, m.curso, v.especie, v.variedad, anioTxt(m.anio), dec(m.cant), v.unidad, dec(m.pg), m.pgFuente, m.destino, m.obs]);
  });
  return f.map(function(r){ return r.map(celda).join(';'); }).join('\r\n');
}
function descargar(nombre, datos){
  var res = $('#g-exp-res');
  if (DESC){
    DESC.save({ filename: nombre, data: datos }).then(function(){ toast('Descargado: ' + nombre); }, function(e){
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited'){ toast('Esperá un momento y probá de nuevo.'); return; }
      mostrarTexto(nombre, datos);
    });
  } else mostrarTexto(nombre, datos);
  function mostrarTexto(n, d){
    if (!res) return toast('No se puede descargar desde esta vista.');
    res.innerHTML = '<p class="nota">No se pudo descargar desde esta vista. Copiá el contenido y pegalo en un archivo ' + esc(n) + '.</p><label class="campo"><span>' + esc(n) + '</span><textarea id="g-exp-txt" readonly>' + esc(d) + '</textarea></label><button class="btn chico" type="button" id="g-exp-c">Copiar</button>';
    $('#g-exp-c').onclick = function(){ copiar(d, $('#g-exp-txt')); };
  }
}
function copiar(texto, el){
  try {
    navigator.clipboard.writeText(texto).then(function(){ toast('Copiado'); }, function(){ selTxt(el); });
  } catch(e){ selTxt(el); }
}
function selTxt(el){
  if (!el) return;
  if (el.select){ el.focus(); el.select(); }
  else { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  toast('Texto seleccionado: copialo con el menú del teléfono.');
}

function cartelSVG(){

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#FFFFFF"/><rect x="22" y="22" width="' + (W - 44) + '" height="' + (H - 44) + '" rx="12" fill="none" stroke="#2E5E3E" stroke-width="4"/>' +
    '<text x="300" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#1D2A20">Banco de Semillas</text>' +
    '<text x="300" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5B6A5E">' + esc2(ST.config.escuela || '') + '</text>' +
    '<g transform="translate(100 168) scale(' + k.toFixed(4) + ')" shape-rendering="crispEdges"><rect width="' + n + '" height="' + n + '" fill="#FFFFFF"/><path transform="translate(4 4)" fill="#000000" d="' + q.d + '"/></g>' +
    '<text x="300" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2E5E3E">Escaneá con la cámara del celular</text>' +
    '<text x="300" y="670" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#1D2A20">Mirá qué semillas hay, su año y su poder germinativo,</text>' +

    '<text x="300" y="760" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#5B6A5E">Sale una semilla, vuelve una cosecha.</text></svg>';
}

/* ===== avisos ===== */
var tt = null;
function toast(msg){
  var t = $('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 3800);
}
function ocupado(on){
  var o = $('.ocupado');
  if (on && !o){ o = document.createElement('div'); o.className = 'ocupado'; o.innerHTML = '<div>Guardando…</div>'; document.body.appendChild(o); }
  else if (!on && o) o.remove();
}

/* ===== arranque ===== */
function usar(n){ try { return (window.claude && window.claude.use) ? window.claude.use(n).catch(function(){ return null; }) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } }
var INIT = API ? iniciarAPI() : Promise.all([usar('artifact'), usar('user'), usar('downloads')]).then(function(r){
  ART = r[0]; DESC = r[2];
  var u = r[1];
  return (u ? u.canEdit().catch(function(){ return false; }) : Promise.resolve(false)).then(function(ce){
    esDocente = !!ce && !!ART; puedeGuardar = esDocente;
  });
}).catch(function(){ puedeGuardar = false; esDocente = false; });

var h0 = (location.hash || '').replace('#', '');
var pedida = ['banco', 'registrar', 'historial', 'aprende', 'docente'].indexOf(h0) >= 0 ? h0 : (ls('bs_tab') || 'banco');
UI.tab = pedida;
UI.vista = ls('bs_vista') === 'planilla' ? 'planilla' : 'fichas';
PEND = revisarPendiente();
pintar();
INIT.then(function(){
  if (esDocente && pedida === 'docente') UI.tab = 'docente';
  var ae = document.activeElement, enForm = ae && ae.closest && ae.closest('form');
  pintarNav();
  if (API && !enForm) pintar(); else if (!enForm && (esDocente || UI.tab === 'docente')) pintarTab(); else botonModo();
});
})();
