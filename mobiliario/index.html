<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sillas, Tablones y Caballetes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&family=Saira+Stencil+One&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style id="app-style">/* Depósito escolar: una chapa por tipo de mueble con su conteo por estado y una planilla de «dónde está cada cosa»; barra inferior de secciones para el pulgar. */
:root{
  --piso:#ECEEED; --chapa:#FAFBFA; --tinta:#1B2226; --tenue:#56636A; --linea:#D0D6D7;
  --hierro:#24506C; --sobre-hierro:#F6F9FB; --hierro-suave:#DBE6ED;
  --pino:#94601F; --pino-suave:#F1E3CC;
  --ok:#2E7549; --ok-suave:#DCEEE2; --alerta:#935A05; --alerta-suave:#F6E7C9; --mal:#AE3F2A; --mal-suave:#F5DCD5;
  --velo:rgba(27,34,38,.45);
  --sombra:0 1px 0 rgba(27,34,38,.05), 0 8px 22px -16px rgba(27,34,38,.45);
  --qr-fondo:#FFFFFF; --qr-tinta:#000000;
  --f-cartel:"Saira Stencil One","Arial Black",Impact,sans-serif;
  --f-texto:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-dato:"Courier Prime",ui-monospace,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --piso:#111517; --chapa:#192024; --tinta:#E3E9EB; --tenue:#9BA8AD; --linea:#2D383D;
    --hierro:#8DB9D8; --sobre-hierro:#0E1A22; --hierro-suave:#1F3240;
    --pino:#E0A75E; --pino-suave:#3A2C18;
    --ok:#74C892; --ok-suave:#1C3324; --alerta:#E7AE52; --alerta-suave:#3A2C14; --mal:#EE8A73; --mal-suave:#3D201A;
    --velo:rgba(0,0,0,.6); --sombra:0 1px 0 rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --piso:#111517; --chapa:#192024; --tinta:#E3E9EB; --tenue:#9BA8AD; --linea:#2D383D;
  --hierro:#8DB9D8; --sobre-hierro:#0E1A22; --hierro-suave:#1F3240;
  --pino:#E0A75E; --pino-suave:#3A2C18;
  --ok:#74C892; --ok-suave:#1C3324; --alerta:#E7AE52; --alerta-suave:#3A2C14; --mal:#EE8A73; --mal-suave:#3D201A;
  --velo:rgba(0,0,0,.6); --sombra:0 1px 0 rgba(0,0,0,.35), 0 10px 24px -16px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--piso);color:var(--tinta);font-family:var(--f-texto);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hierro);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}

/* encabezado */
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-bottom:14px;border-bottom:2px solid var(--tinta);margin-bottom:16px}
.cab-esc{font-family:var(--f-dato);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.cab h1{font-family:var(--f-cartel);font-weight:400;font-size:clamp(1.8rem,6.6vw,3rem);line-height:1;margin:.14em 0 0;letter-spacing:.01em;text-wrap:balance}
.cab-datos{font-family:var(--f-dato);font-size:.85rem;color:var(--tenue);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.cab-datos b{color:var(--tinta);font-weight:700}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--chapa);border-top:1px solid var(--linea);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-around;gap:2px}
.nav button{flex:1 1 0;min-width:0;background:none;border:0;border-radius:10px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tenue);font-size:.72rem;line-height:1.15;cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--hierro);background:var(--hierro-suave);font-weight:700}

/* tipografía y bloques */
.h2{font-family:var(--f-texto);font-weight:700;font-size:1.4rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.h3{font-family:var(--f-texto);font-weight:700;font-size:1.1rem;margin:0;line-height:1.2;text-wrap:balance}
.nota{color:var(--tenue);margin:0 0 14px;max-width:64ch}
.mono{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.tenue{color:var(--tenue)}
.vacio{padding:26px 16px;text-align:center;color:var(--tenue);border:1px dashed var(--linea);border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* fichas de cada mueble */
.tipos{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (max-width:900px){.tipos{grid-template-columns:repeat(var(--cols-m,2),minmax(0,1fr))}}
@media (max-width:540px){.tipos{grid-template-columns:minmax(0,1fr)}}
.tcard{background:var(--chapa);border:1px solid var(--linea);border-radius:8px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sombra)}
.tcard-cab{display:flex;gap:12px;align-items:center}
.tico{flex:0 0 auto;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--hierro-suave);color:var(--hierro)}
.tico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tnom{font-weight:700;font-size:1.2rem;line-height:1.15;margin:0}
.tsub{font-size:.86rem;color:var(--tenue)}
.big{display:flex;align-items:flex-end;gap:10px}
.big b{font-family:var(--f-cartel);font-weight:400;font-size:3.3rem;line-height:.9;color:var(--hierro);font-variant-numeric:tabular-nums}
.big span{font-size:.9rem;color:var(--tenue);line-height:1.25;padding-bottom:3px}
.barra{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--piso);border:1px solid var(--linea)}
.barra i{display:block;height:100%}
.b-disp,.c-disp{background:var(--hierro)} .b-pre,.c-pre{background:var(--pino)} .b-rot,.c-rot{background:var(--mal)}
.ley{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;margin:0;font-size:.92rem}
.ley dt{display:flex;align-items:center;gap:7px;color:var(--tenue)}
.ley dd{margin:0;text-align:right;font-family:var(--f-dato);font-variant-numeric:tabular-nums;font-weight:700}
.ley i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto}
.ley .tot{border-top:1px solid var(--linea);padding-top:4px;margin-top:3px}
.ley dt.tot{color:var(--tinta);font-weight:700}

/* para atender */
.atender{background:var(--chapa);border:1px solid var(--linea);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.at-fila{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.at-fila p{margin:0;flex:1 1 220px;min-width:0}
.punto{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--tenue)}
.punto.mal{background:var(--mal)} .punto.alerta{background:var(--alerta)} .punto.ok{background:var(--ok)}

/* dónde está */
.sec-tit{margin:4px 0 10px}
.sec-tit .nota{margin:0}
.lugares{background:var(--chapa);border:1px solid var(--linea);border-radius:8px}
.lugar{padding:12px 16px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:7px}
.lugar:last-child{border-bottom:0}
.lugar-cab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:center}
.lugar-nom{font-weight:700;font-size:1.05rem;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lugar-tag{font-family:var(--f-dato);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--tenue);font-weight:400}
.lugar.base{background:var(--hierro-suave);border-radius:8px 8px 0 0}
.lugar.rot{background:var(--mal-suave)}
.lugar.rot:last-child{border-radius:0 0 8px 8px}
.cms{display:flex;flex-wrap:wrap;gap:6px}
.cm{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-dato);font-size:.88rem;border:1px solid var(--linea);border-radius:5px;padding:2px 8px 2px 5px;background:var(--chapa);font-variant-numeric:tabular-nums;white-space:nowrap}
.cm svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--tenue)}
.cm b{font-weight:700}
.quienes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.93rem;color:var(--tenue)}
.quienes li{padding-left:14px;position:relative}
.quienes li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:1.5px;background:var(--tenue)}
.quienes b{color:var(--tinta)}

/* herramientas */
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.buscar{flex:1 1 240px;min-width:0;position:relative}
.buscar input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--linea);border-radius:10px;background:var(--chapa)}
.buscar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--tenue);fill:none;stroke-width:2}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linea);background:var(--chapa);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;color:var(--tenue)}
.chip b{font-family:var(--f-dato);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--hierro);border-color:var(--hierro);color:var(--sobre-hierro)}

/* píldoras y etiquetas */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;font-family:var(--f-dato);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-suave);color:var(--ok)}
.pill.alerta{background:var(--alerta-suave);color:var(--alerta)}
.pill.mal{background:var(--mal-suave);color:var(--mal)}
.etq{display:inline-block;font-size:.76rem;border-radius:4px;padding:0 7px;font-weight:700;font-family:var(--f-dato)}
.etq.ej{background:var(--pino-suave);color:var(--pino)}

/* paneles y formularios */
.panel{background:var(--chapa);border:1px solid var(--linea);border-radius:10px;padding:16px;box-shadow:var(--sombra)}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--linea);border-radius:12px;overflow:hidden;margin:4px 0 16px;background:var(--linea)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:12px 4px;text-align:center;cursor:pointer;font-weight:700;color:var(--tenue);font-size:.92rem;background:var(--piso)}
.seg input:checked+label{background:var(--hierro);color:var(--sobre-hierro)}
.seg input:focus-visible+label{outline:2px solid var(--hierro);outline-offset:-4px}
@media (max-width:440px){.seg{grid-template-columns:repeat(2,1fr)}}
form{display:flex;flex-direction:column;gap:12px}
.fila2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.fila2.chica{grid-template-columns:repeat(2,minmax(0,1fr))}
.campo{display:flex;flex-direction:column;gap:4px;min-width:0;border:0;margin:0;padding:0}
.campo>span,.campo>legend{font-size:.88rem;font-weight:700;color:var(--tenue)}
.campo legend{margin-bottom:6px;padding:0}
.campo>input,.campo>select,.campo>textarea{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:8px;background:var(--piso);min-width:0}
.campo textarea{min-height:110px;resize:vertical;font-family:var(--f-dato);font-size:.85rem}
.btn{border:1px solid var(--linea);background:var(--chapa);border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.prim{background:var(--hierro);border-color:var(--hierro);color:var(--sobre-hierro);padding:13px 18px;font-size:1.02rem}
.btn.peligro{color:var(--mal);border-color:var(--mal)}
.btn.chico{padding:5px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.lnk{border:0;background:none;padding:0;color:var(--hierro);text-decoration:underline;font-weight:700;cursor:pointer}
.err{color:var(--mal);font-weight:700;font-size:.92rem}
.err:empty{display:none}

/* cantidades con − y + */
.items{display:flex;flex-direction:column;border:1px solid var(--linea);border-radius:8px;background:var(--piso)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.item .tico{width:34px;height:34px;background:var(--chapa)}
.item-nom{font-weight:700;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.item-nom small{font-weight:400;color:var(--tenue);font-size:.84rem}
.step{display:inline-flex;align-items:stretch;border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:var(--chapa)}
.step-b{border:0;background:none;width:40px;font-size:1.25rem;font-weight:700;cursor:pointer;color:var(--hierro);line-height:1}
.step-b:active{background:var(--hierro-suave)}
.step-i{width:58px;border:0;border-left:1px solid var(--linea);border-right:1px solid var(--linea);text-align:center;font-family:var(--f-dato);font-weight:700;font-size:1.05rem;padding:8px 2px;background:var(--chapa);-moz-appearance:textfield;appearance:textfield}
.step-i::-webkit-outer-spin-button,.step-i::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* vistas previas */
.prev{border:1px dashed var(--hierro);border-radius:10px;padding:12px 14px;background:var(--hierro-suave);display:flex;flex-direction:column;gap:8px}
.prev:empty{display:none}
.prev p{margin:0}
.flechas{display:flex;flex-direction:column;gap:4px}
.flecha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.flecha .nom{min-width:7.5em;font-family:var(--f-texto)}
.flecha .de,.flecha .a{padding:1px 8px;border-radius:5px;background:var(--chapa);font-weight:700}
.flecha .a.neg{color:var(--mal)}
.mini{font-size:.9rem;margin:0}
.mini.alerta{color:var(--alerta);font-weight:700}
.mini.mal{color:var(--mal);font-weight:700}

/* devolución */
.devs{display:flex;flex-direction:column;gap:10px}
.dev{border:1px solid var(--linea);border-radius:8px;padding:10px 12px;background:var(--piso);display:flex;flex-direction:column;gap:8px}
.dev-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dev .tico{width:30px;height:30px;background:var(--chapa)}
.dev .tico svg{width:20px;height:20px}
.dev .campo>input,.dev .campo>select{background:var(--chapa)}

/* listas de movimientos */
.lista{background:var(--chapa);border:1px solid var(--linea);border-radius:10px;padding:2px 14px}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:0}
.mov-tipo{grid-row:span 2;width:38px;height:36px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-dato);font-weight:700;font-size:.78rem}
.t-pre{background:var(--pino-suave);color:var(--pino)}
.t-dev{background:var(--ok-suave);color:var(--ok)}
.t-rot{background:var(--mal-suave);color:var(--mal)}
.t-alta{background:var(--hierro-suave);color:var(--hierro)}
.mov-l1{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0}
.mov-l1 strong{font-weight:700}
.mov-l2{color:var(--tenue);font-size:.9rem;display:flex;flex-wrap:wrap;gap:2px 12px;min-width:0}
.mov-acc{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fecha{font-family:var(--f-dato);font-size:.8rem;color:var(--tenue)}

/* resumen del historial */
.donde .chips{margin-top:10px}
.resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:10px;overflow:hidden;margin:0 0 12px}
@media (max-width:640px){.resumen{grid-template-columns:repeat(2,minmax(0,1fr))}}
.resumen>div{background:var(--chapa);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.resumen dt{font-family:var(--f-dato);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}
.resumen dd{margin:0;display:flex;flex-direction:column;gap:2px}
.resumen dd b{font-family:var(--f-cartel);font-weight:400;font-size:1.8rem;line-height:1;color:var(--hierro);font-variant-numeric:tabular-nums}
.resumen dd span{font-size:.86rem;color:var(--tenue);line-height:1.3}

/* gestión */
details.sec{background:var(--chapa);border:1px solid var(--linea);border-radius:10px}
details.sec>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--f-dato);color:var(--hierro);font-size:1.2rem}
details.sec[open]>summary::after{content:"−"}
details.sec>.sec-in{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.sec-in p{margin:0}
.qr-caja{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qr{background:var(--qr-fondo);padding:10px;border-radius:8px;width:180px;max-width:100%;border:1px solid var(--linea)}
.qr svg{display:block;width:100%;height:auto}
.url{font-family:var(--f-dato);font-size:.82rem;word-break:break-all;background:var(--piso);padding:6px 8px;border-radius:6px;user-select:all}
.cartel-img{max-width:260px;border:1px solid var(--linea);border-radius:6px;background:#FFFFFF}

/* avisos */
.aviso{border-radius:10px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--linea);background:var(--chapa)}
.aviso.alerta{background:var(--alerta-suave);border-color:var(--alerta)}
.aviso.ej{background:var(--pino-suave);border-color:var(--pino)}
.aviso p{margin:0}

/* hoja de detalle */
.velo{position:fixed;inset:0;background:var(--velo);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--piso);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.velo{align-items:center}.hoja{border-radius:14px;max-height:86%}}
.hoja-cab{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hoja p{margin:0}

  });
  Object.keys(R).forEach(function(id){ if (R[id].abiertas > 0) rotas.push(R[id]); });
  abiertos.sort(function(a, b){ return cmpMov(a.m, b.m); });
  rotas.sort(function(a, b){ return cmpMov(a.m, b.m); });
  return { TP: tp, T: T, P: P, R: R, ms: ms, abiertos: abiertos, rotas: rotas };
}

function construirHTML(st){
  var css = document.getElementById('app-style').textContent;
  var code = document.getElementById('app-code').textContent;
  var json = JSON.stringify(st).replace(/</g, '\\u003c');
  return HEAD_HTML + TOP_HTML + '<style id="app-style">' + css + '</style>\n<div id="app"></div>\n<script id="estado" type="application/json">' + json + '<\/script>\n<script id="app-code">' + code + '<\/script>\n</body></html>';
}
function borrarMovs(st, ids){
  var cambio = true;
  while (cambio){
    cambio = false;
    st.movs.forEach(function(m){ if (!ids[m.id] && (ids[m.prestamoId] || ids[m.roturaId] || ids[m.origen])){ ids[m.id] = 1; cambio = true; } });
  }
  st.movs = st.movs.filter(function(m){ return !ids[m.id]; });
}
function aplicar(st, p){
  if (p.op === 'multi'){ p.ops.forEach(function(o){ aplicar(st, o); }); }
  else if (p.op === 'addMovs'){
    var ids = {}; st.movs.forEach(function(m){ ids[m.id] = 1; });
    p.movs.forEach(function(m){ if (!ids[m.id]){ st.movs.push(m); ids[m.id] = 1; } });
  } else if (p.op === 'delMov'){ var b = {}; b[p.id] = 1; borrarMovs(st, b); }
  else if (p.op === 'updMov'){ st.movs.forEach(function(m){ if (m.id === p.id) Object.keys(p.campos).forEach(function(k){ m[k] = p.campos[k]; }); }); }
  else if (p.op === 'setTipo'){
    var i = st.tipos.findIndex(function(t){ return t.id === p.t.id; });
    if (i >= 0) st.tipos[i] = p.t; else st.tipos.push(p.t);
  } else if (p.op === 'delTipo'){ st.tipos = st.tipos.filter(function(t){ return t.id !== p.id; }); }
  else if (p.op === 'config'){ Object.keys(p.c).forEach(function(k){ st.config[k] = p.c[k]; }); }
  else if (p.op === 'delEjemplos'){
    var e = {}; st.movs.forEach(function(m){ if (m.ej) e[m.id] = 1; });
    borrarMovs(st, e);
    if (st.reservas) st.reservas = st.reservas.filter(function(r){ return !r.ej; });
  }
  return st;
}
var reintentado = false;
function guardar(patch, desc){
  if (MODO === 'api') return guardarAPI(patch, desc);
  if (!ART){ toast('Desde esta vista no se puede guardar.'); return; }
  patch.pid = uid('p');
  var nuevo = aplicar(clon(ST), clon(patch));
  nuevo.ultimoCambio = patch.pid;
  ss('mb_pend', JSON.stringify({ patch: patch, desc: desc }));
  ocupado(true);
  return ART.publish(construirHTML(nuevo)).then(function(){
    ocupado(false); cerrarHoja(); toast('Guardado: ' + desc);
  }, function(e){
    var c = e && e.code;
    if (c === 'conflict'){ toast('Alguien guardó al mismo tiempo. La página se actualiza…'); return; }
    ss('mb_pend', null); ocupado(false);
    if (c === 'upstream_error' && !reintentado){ reintentado = true; setTimeout(function(){ guardar(patch, desc); }, 800 + Math.random() * 900); return; }
    if (c === 'not_writer' || c === 'not_granted' || c === 'not_declared' || c === 'consent_required' || c === 'capability_disabled' || c === 'capability_removed'){
      puedeGuardar = false; esDocente = false; cerrarHoja(); pintar(); toast('Esta vista es de solo lectura. Usá «Preparar mensaje para el docente».'); return;
    }
    if (c === 'rate_limited'){ toast('Se guardaron muchos cambios seguidos. Esperá unos segundos y probá de nuevo.'); return; }
    if (c === 'too_large'){ toast('El registro llegó al tamaño máximo. Exportá la planilla y borrá movimientos viejos.'); return; }
    toast('No se pudo guardar. Probá de nuevo en un momento.');
  });
}
function revisarPendiente(){
  var raw = ss('mb_pend'); if (!raw) return null;
  var p; try { p = JSON.parse(raw); } catch(e){ ss('mb_pend', null); return null; }
  if (ST.ultimoCambio === p.patch.pid){ ss('mb_pend', null); setTimeout(function(){ toast('Guardado: ' + p.desc); }, 300); return null; }

}

function b64(s){ var b = new TextEncoder().encode(s), t = ''; for (var i = 0; i < b.length; i++) t += String.fromCharCode(b[i]); return btoa(t); }
function deb64(s){ var t = atob(s), b = new Uint8Array(t.length); for (var i = 0; i < t.length; i++) b[i] = t.charCodeAt(i); return new TextDecoder().decode(b); }
function codigo(paq){ return 'MB1.' + b64(JSON.stringify(paq)); }
function leerCodigos(txt){
  var out = [], re = /MB1\.([A-Za-z0-9+\/=]+)/g, x;
  while ((x = re.exec(txt))){ try { out.push({ paq: JSON.parse(deb64(x[1])) }); } catch(e){ out.push({ err: 'Código dañado o incompleto' }); } }
  return out;
}

  }

function enlazarSteps(root, cambio){
  $$('.step-b', root).forEach(function(b){ b.onclick = function(){ var i = document.getElementById(b.dataset.for), v = ent(i.value); if (isNaN(v)) v = 0; v = Math.max(0, v + (+b.dataset.step)); i.value = v || ''; if (cambio) cambio(); }; });

function leerItems(pref){

  ST.tipos.forEach(function(t){
    var el = document.getElementById(pref + t.id); if (!el) return;

}
function llenarPrestamos(sel){

    return '<option value="' + p.m.id + '">' + esc(fCorta(p.m.t) + ' · ' + p.m.quien + ' · ' + p.m.lugar + ' — ' + itemsTxt(pendItems(p))) + '</option>';
  }).join('');

function itemsDevolucion(){

    '<div class="devs">' + its.map(function(i){

        '<div class="fila2 chica"><label class="campo"><span>Devuelvo</span><input id="d-c-' + i.tid + '" type="number" inputmode="numeric" min="0" max="' + i.cant + '" value="' + i.cant + '"></label>' +
        '<label class="campo"><span>' + (reparable(i.tid) ? '¿Cuántos vienen rotos?' : '¿Cuántos rotos? Se descartan') + '</span><input id="d-r-' + i.tid + '" type="number" inputmode="numeric" min="0" value="0"></label></div>' +
        '<label class="campo" id="d-fw-' + i.tid + '" hidden><span>¿Qué les pasó?</span><select id="d-f-' + i.tid + '"></select></label></div>';
    }).join('') + '</div>';
  its.forEach(function(i){ llenarFallas($('#d-f-' + i.tid), TP[i.tid]); $('#d-c-' + i.tid).oninput = prevDevolucion; $('#d-r-' + i.tid).oninput = prevDevolucion; });
  prevDevolucion();
}
function leerDevolucion(){
  var p = C.P[$('#d-pre') && $('#d-pre').value]; if (!p) return { error: 'Elegí el retiro que devolvés.' };
  var items = [], roturas = [], error = '';
  pendItems(p).forEach(function(i){
    var c = ent($('#d-c-' + i.tid).value || '0'), r = ent($('#d-r-' + i.tid).value || '0'), nom = nomT(i.tid, 2);
    if (isNaN(c) || isNaN(r)){ error = error || 'Revisá las cantidades de ' + nom + ': van en números enteros.'; return; }
    if (c > i.cant){ error = error || 'De ' + nom + ' faltan volver ' + n0(i.cant) + ', no más.'; return; }
    if (r > c){ error = error || 'Los ' + nom + ' rotos no pueden ser más que los que devolvés.'; return; }
    $('#d-fw-' + i.tid).hidden = r <= 0;
    if (c > 0) items.push({ tid: i.tid, cant: c, rotas: r });
    if (r > 0) roturas.push({ tid: i.tid, cant: r, falla: $('#d-f-' + i.tid).value });
  });
  if (!error && !items.length) error = 'Indicá cuánto devolvés.';
  return { p: p, items: items, roturas: roturas, error: error };
}
function prevDevolucion(){
  var D = leerDevolucion(), box = $('#r-prev');
  if (D.error || !D.p){ box.innerHTML = D.error && D.p ? '<p class="mini mal">' + esc(D.error) + '</p>' : ''; return; }
  var resto = pendItems(D.p).map(function(i){ var d = D.items.filter(function(x){ return x.tid === i.tid; })[0]; return { tid: i.tid, cant: i.cant - (d ? d.cant : 0) }; }).filter(function(i){ return i.cant > 0; });
  box.innerHTML = '<p>' + (resto.length ? 'Después de esto todavía faltan volver <b>' + esc(itemsTxt(resto)) + '</b>.' : '<b>Con esto el retiro queda completo.</b>') + '</p>' +
    avisoRoturas(D.roturas);
}
function prevRotura(){
  var tid = $('#k-tipo').value, n = ent($('#k-cant').value), x = C.T[tid], d = Math.max(0, x.disp), box = $('#r-prev');
  if (isNaN(n) || n <= 0){ box.innerHTML = ''; return; }
  var rep = reparable(tid);
  box.innerHTML = '<div class="flechas"><div class="flecha"><span class="nom">' + esc(TP[tid].plural) + ' disponibles</span><span class="de">' + n0(d) + '</span><span aria-hidden="true">→</span><span class="a' + (d - n < 0 ? ' neg' : '') + '">' + n0(d - n) + '</span></div>' +
    (rep ? '' : '<div class="flecha"><span class="nom">Total</span><span class="de">' + n0(x.total) + '</span><span aria-hidden="true">→</span><span class="a">' + n0(x.total - n) + '</span></div>') + '</div>' +
    (rep ? '<p class="mini">Pasa a «para reparar» hasta que se arregle.</p>' : '<p class="mini alerta">' + esc(TP[tid].plural) + ': no tienen arreglo. Se descartan y se descuentan del total.</p>') +
    (n > d ? '<p class="mini mal">En el depósito hay ' + n0(d) + '. Si lo que se rompió está retirado, avisalo al devolverlo.</p>' : '');
}
function enviarRegistro(){
  var err = $('#r-err'); err.textContent = '';
  var quien = $('#r-quien').value.trim(), rol = $('#r-rol').value.trim(), obs = $('#r-obs').value.trim(), t = new Date().toISOString();
  if (!quien){ err.textContent = 'Escribí tu nombre y apellido.'; $('#r-quien').focus(); return; }
  ls('mb_quien', quien); ls('mb_rol', rol);
  var paq = { movs: [], res: [] }, desc;
  if (UI.rtipo === 'prestamo'){
    var L = leerItems('r-c-'), lugar = $('#r-lugar').value.trim(), hasta = $('#r-hasta').value, tel = $('#r-tel').value.trim();
    if (L.error){ err.textContent = L.error; return; }
    if (!L.items.length){ err.textContent = 'Indicá qué retirás y cuántos.'; return; }
    for (var i = 0; i < L.items.length; i++){ var d = Math.max(0, C.T[L.items[i].tid].disp); if (L.items[i].cant > d){ err.textContent = 'No alcanza: hay ' + n0(d) + ' ' + nomT(L.items[i].tid, d) + ' en el depósito.'; return; } }
    if (!lugar){ err.textContent = 'Escribí adónde lo llevás, así se puede ubicar.'; $('#r-lugar').focus(); return; }
    if (hasta && hasta < HOY){ err.textContent = 'La fecha de vuelta ya pasó.'; return; }
    if (!tel){ err.textContent = 'Dejá un teléfono de contacto, así se puede ubicar lo que se lleva.'; $('#r-tel').focus(); return; }
    if (!hasta){ err.textContent = 'Poné cuándo lo devolvés.'; $('#r-hasta').focus(); return; }
    ls('mb_tel', tel);
    var mp = { id: uid('m'), t: t, tipo: 'prestamo', quien: quien, rol: rol, items: L.items, lugar: lugar, hasta: hasta, obs: obs };
    mp.tel = tel;
    paq.movs.push(mp);
    desc = 'retiro de ' + itemsTxt(L.items) + ' (' + quien + ')';
  } else if (UI.rtipo === 'devolucion'){
    var D = leerDevolucion();
    if (D.error){ err.textContent = D.error; return; }
    var m = { id: uid('m'), t: t, tipo: 'devolucion', prestamoId: D.p.m.id, quien: quien, rol: rol, items: D.items, obs: obs };
    paq.movs.push(m);
    D.roturas.forEach(function(r){ var mr = { id: uid('m'), t: t, tipo: 'rotura', tid: r.tid, cant: r.cant, falla: r.falla, detalle: '', lugar: 'Depósito', quien: quien, rol: rol, origen: m.id }; if (!reparable(r.tid)) mr.descarte = true; paq.movs.push(mr); });
    desc = 'devolución de ' + itemsTxt(D.items) + ' (' + quien + ')';
  } else if (UI.rtipo === 'rotura'){
    var tid = $('#k-tipo').value, n = ent($('#k-cant').value), disp = Math.max(0, C.T[tid].disp), kl = $('#k-lugar').value.trim();
    if (isNaN(n) || n <= 0){ err.textContent = 'Indicá cuántos se rompieron.'; return; }
    if (n > disp){ err.textContent = 'En el depósito hay ' + n0(disp) + ' ' + nomT(tid, disp) + '. Si lo que se rompió está retirado, avisalo al devolverlo.'; return; }
    if (!kl){ err.textContent = 'Escribí dónde está, así se puede encontrar.'; return; }
    var mr = { id: uid('m'), t: t, tipo: 'rotura', tid: tid, cant: n, falla: $('#k-falla').value, detalle: obs, lugar: kl, quien: quien, rol: rol };
    if (!reparable(tid)) mr.descarte = true;
    paq.movs.push(mr);
    desc = (mr.descarte ? 'descarte de ' : 'rotura de ') + n0(n) + ' ' + nomT(tid, n);
  } else {

      var quien = (ms[0] || {}).quien || '';
      if (!ok){ filas.push('<div class="mov"><div class="mov-tipo t-rot">!</div><div class="mov-l1">El mensaje' + (quien ? ' de ' + esc(quien) : '') + ' no se puede cargar: es de un mueble, retiro o rotura que ya no está en la página.</div></div>'); return; }
      if (ya){ filas.push('<div class="mov"><div class="mov-tipo t-dev">OK</div><div class="mov-l1">Ya cargado: ' + esc(quien) + '</div></div>'); return; }
      ms.forEach(function(m){ if (!ids[m.id]){ movs.push(m); ids[m.id] = 1; } });
      ms.forEach(function(m){ if (!(m.tipo === 'rotura' && m.origen)) filas.push(htmlMov(m).replace(/<div class="mov-acc">[\s\S]*?<\/div><\/div>$/, '</div>')); });
    });
    var avisos = '';
    if (movs.length){
      var sim = calc(aplicar(clon(ST), { op: 'addMovs', movs: movs }));
      ST.tipos.forEach(function(t){ if (sim.T[t.id].disp < 0) avisos += '<p class="mini mal">Ojo: con esto quedarían ' + n0(sim.T[t.id].disp) + ' ' + esc(t.plural.toLowerCase()) + ' en el depósito. Alguien anotó más de lo que hay.</p>'; });
    }
    leidos = movs;
    var n = movs.filter(function(m){ return !(m.tipo === 'rotura' && m.origen); }).length;
    box.innerHTML = '<div class="lista">' + filas.join('') + '</div>' + avisos + (n ? '<button class="btn prim" type="button" id="g-comp-ok">Cargar ' + n + (n > 1 ? ' registros' : ' registro') + '</button>' : '');
    var ok = $('#g-comp-ok'); if (ok) ok.onclick = function(){ guardar({ op: 'addMovs', movs: leidos }, n + (n > 1 ? ' registros' : ' registro') + ' desde mensajes'); };
  };
  // alta
  enlazarSteps($('#g-ing'));
  $('#g-ing').onsubmit = function(e){
    e.preventDefault(); var er = $('#gi-err'); er.textContent = '';
    var L = leerItems('gi-c-');
    if (L.error){ er.textContent = L.error; return; }
    if (!L.items.length){ er.textContent = 'Indicá cuántos entran.'; return; }
    guardar({ op: 'addMovs', movs: [{ id: uid('m'), t: new Date().toISOString(), tipo: 'ingreso', items: L.items, origen: $('#gi-or').value, obs: $('#gi-obs').value.trim() }] }, 'alta de ' + itemsTxt(L.items));
  };
  // muebles
  function cargarTipo(){
    var t = TP[$('#gt-sel').value] || {};
    $('#gt-nom').value = t.nombre || ''; $('#gt-plu').value = t.plural || ''; $('#gt-cla').value = t.clase || 'otro';
    $('#gt-gua').value = t.guardado || (t.id ? '' : 'Depósito'); $('#gt-not').value = t.notas || ''; $('#gt-rep').value = t.reparable === false ? 'no' : 'si';
    $('#gt-del').hidden = !t.id; $('#gt-err').textContent = '';
  }
  $('#gt-sel').onchange = function(){ UI.tipoSel = this.value; cargarTipo(); };
  cargarTipo();
  $('#g-tipo').onsubmit = function(e){
    e.preventDefault(); var er = $('#gt-err'); er.textContent = '';
    var id = $('#gt-sel').value, nom = $('#gt-nom').value.trim(), plu = $('#gt-plu').value.trim();
    if (!nom || !plu){ er.textContent = 'Completá el nombre en singular y en plural.'; return; }
    var t = { id: id || uid('t'), nombre: nom, plural: plu, clase: $('#gt-cla').value, guardado: $('#gt-gua').value.trim(), notas: $('#gt-not').value.trim(), reparable: $('#gt-rep').value !== 'no' };
    UI.tipoSel = t.id;
    guardar({ op: 'setTipo', t: t }, (id ? 'cambios en ' : 'mueble nuevo: ') + plu.toLowerCase());
  };
  $('#gt-del').onclick = function(){
    var id = $('#gt-sel').value, er = $('#gt-err');
    var usado = ST.movs.some(function(m){ return itemsDe(m).some(function(i){ return i.tid === id; }); });
    if (usado){ er.textContent = 'Tiene movimientos anotados. Para sacarlo, primero borrá esos registros desde Historial.'; return; }
    hoja(cabHoja('Borrar mueble') + '<p>Se borra «' + esc(TP[id].plural) + '» de la lista.</p><div class="btns"><button class="btn peligro" type="button" id="h-si">Borrar</button><button class="btn" type="button" id="h-no">Volver</button></div>', function(v){
      $('#h-no', v).onclick = cerrarHoja; $('#h-si', v).onclick = function(){ UI.tipoSel = ''; guardar({ op: 'delTipo', id: id }, 'mueble borrado'); };
    });
  };
  // QR
  $('#g-url').onsubmit = function(e){
    e.preventDefault(); var u = $('#gq-url').value.trim();
    if (u && !/^https?:\/\//i.test(u)){ toast('La dirección tiene que empezar con https://'); return; }
    guardar({ op: 'config', c: { url: u } }, 'dirección para el QR');
  };
  pintarQR();
  // exportar
  $('#g-x-inv').onclick = function(){ descargar('mobiliario-inventario-' + HOY + '.csv', csvInventario()); };
  $('#g-x-pre').onclick = function(){ descargar('mobiliario-afuera-' + HOY + '.csv', csvPrestado()); };
  $('#g-x-mov').onclick = function(){ descargar('mobiliario-movimientos-' + HOY + '.csv', csvMovs()); };
  // ajustes
  $('#g-aj').onsubmit = function(e){
    e.preventDefault();
    guardar({ op: 'config', c: { escuela: $('#ga-esc').value.trim(), wa: $('#ga-wa').value.replace(/\D/g, '') } }, 'ajustes');
  };
}

/* ===== QR y cartel ===== */
function qrDatos(url){
  if (!url || typeof window.qrcode !== 'function') return null;
  try {
    var q = window.qrcode(0, 'M'); q.addData(url); q.make();
    var n = q.getModuleCount(), d = '';
    for (var r = 0; r < n; r++){ var c = 0; while (c < n){ if (q.isDark(r, c)){ var s = c; while (c < n && q.isDark(r, c)) c++; d += 'M' + s + ' ' + r + 'h' + (c - s) + 'v1h-' + (c - s) + 'z'; } else c++; } }
    return { n: n, d: d };
  } catch(e){ return null; }
}
function qrSVG(q){
  var n = q.n + 8;
  return '<svg viewBox="0 0 ' + n + ' ' + n + '" role="img" aria-label="Código QR de la página" shape-rendering="crispEdges"><rect width="' + n + '" height="' + n + '" style="fill:var(--qr-fondo)"/><path transform="translate(4 4)" style="fill:var(--qr-tinta)" d="' + q.d + '"/></svg>';
}
function cartelSVG(q){
  var n = q.n + 8, W = 600, H = 820, k = 400 / n;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#FFFFFF"/><rect x="22" y="22" width="' + (W - 44) + '" height="' + (H - 44) + '" rx="12" fill="none" stroke="#24506C" stroke-width="4"/>' +
    '<text x="300" y="92" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#1B2226">Sillas, tablones</text>' +
    '<text x="300" y="136" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#1B2226">y caballetes</text>' +
    '<text x="300" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#56636A">' + esc(ST.config.escuela || '') + '</text>' +
    '<g transform="translate(100 190) scale(' + k.toFixed(4) + ')" shape-rendering="crispEdges"><rect width="' + n + '" height="' + n + '" fill="#FFFFFF"/><path transform="translate(4 4)" fill="#000000" d="' + q.d + '"/></g>' +
    '<text x="300" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#24506C">Escaneá con la cámara del celular</text>' +
    '<text x="300" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1B2226">Mirá qué hay en el depósito, anotá lo que retirás</text>' +
    '<text x="300" y="710" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1B2226">y lo que devolvés, y avisá si algo se rompe.</text>' +
    '<text x="300" y="768" text-anchor="middle" font-family="Courier New, monospace" font-size="16" fill="#56636A">Lo que se lleva, vuelve.</text></svg>';
}
function pintarQR(){
  var box = $('#gq-box'); if (!box) return;
  var url = ST.config.url;
  if (!url){ box.innerHTML = '<p class="tenue">Cuando guardes la dirección, acá aparece el QR para imprimir.</p>'; return; }
  var q = qrDatos(url);
  if (!q){
    box.innerHTML = '<p class="tenue">Cargando el QR…</p>';
    var intentos = 0, iv = setInterval(function(){ intentos++; if (typeof window.qrcode === 'function' || intentos > 20){ clearInterval(iv); if (typeof window.qrcode === 'function') pintarQR(); else if ($('#gq-box')) $('#gq-box').innerHTML = '<p class="err">No se pudo generar el QR desde esta vista. Probá con otra conexión.</p>'; } }, 300);
    return;
  }
  box.innerHTML = '<div class="qr-caja"><div class="qr">' + qrSVG(q) + '</div><div class="stack" style="flex:1 1 220px;min-width:0"><div class="url" id="gq-u">' + esc(url) + '</div>' +
    '<div class="btns"><button class="btn" type="button" id="gq-c">Copiar enlace</button><button class="btn" type="button" id="gq-d">Descargar cartel</button></div><div id="gq-res"></div></div></div>';
  $('#gq-c').onclick = function(){ copiar(url, $('#gq-u')); };
  $('#gq-d').onclick = function(){
    var svg = cartelSVG(q);
    if (!EN_CLAUDE){ descargar('cartel-mobiliario.svg', svg); return; }
    if (DESC) DESC.save({ filename: 'cartel-mobiliario.svg', data: svg }).then(function(){ toast('Cartel descargado.'); }, function(e){ if (!e || e.code !== 'declined') mostrarCartel(svg); });
    else mostrarCartel(svg);
  };
}
function mostrarCartel(svg){
  $('#gq-res').innerHTML = '<p class="nota" style="margin:0">Mantené apretada la imagen (o clic derecho) para guardarla.</p><img class="cartel-img" alt="Cartel con QR" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '">';
}

/* ===== exportar ===== */
function celda(x){ x = x == null ? '' : String(x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }
function csv(filas){ return '﻿' + filas.map(function(f){ return f.map(celda).join(';'); }).join('\r\n'); }
function csvInventario(){
  return csv([['Mueble', 'Total', 'En el depósito', 'Retirados', 'Para reparar', 'Descartados por rotura', 'Dónde se guardan']].concat(ST.tipos.map(function(t){
    var x = C.T[t.id]; return [t.plural, x.total, x.disp, x.prestado, x.rotas, x.desc, t.guardado || ''];
  })));
}
function csvPrestado(){
  var f = [['Retirado el', 'Quién', 'Curso o área', 'Dónde está', 'Teléfono', 'Vuelve', 'Vencido', 'Mueble', 'Cantidad']];
  C.abiertos.forEach(function(p){ pendItems(p).forEach(function(i){ f.push([diaLocal(new Date(p.m.t)), p.m.quien, p.m.rol || '', p.m.lugar, p.m.tel || '', p.m.hasta || '', p.vencido ? 'sí' : '', TP[i.tid] ? TP[i.tid].plural : '', i.cant]); }); });
  return csv(f);
}
function csvMovs(){
  var f = [['Fecha', 'Tipo', 'Mueble', 'Cantidad', 'Rotos', 'Quién', 'Curso o área', 'Lugar', 'Teléfono', 'Falla u origen', 'Vuelve', 'Observaciones', 'Ejemplo']];
  C.ms.forEach(function(m){
    itemsDe(m).forEach(function(i){
      f.push([diaLocal(new Date(m.t)), (m.descarte ? 'Rotura y descarte' : TIPO_TXT[m.tipo] || m.tipo), TP[i.tid] ? TP[i.tid].plural : '', i.cant, i.rotas || '', m.quien || '', m.rol || '', m.lugar || '', m.tel || '', m.motivo || m.falla || m.origen || '', m.hasta || '', m.obs || m.detalle || '', m.ej ? 'sí' : '']);
    });
  });
  return csv(f);
}
function descargar(nombre, datos){
  if (!EN_CLAUDE){
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([datos], { type: /\.svg$/.test(nombre) ? 'image/svg+xml' : 'text/csv;charset=utf-8' }));
      a.download = nombre; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast('Descargado: ' + nombre); return;
    } catch(e){}
  }
  if (DESC){
    DESC.save({ filename: nombre, data: datos }).then(function(){ toast('Descargado: ' + nombre); }, function(e){ if (e && e.code === 'declined') return; mostrarTexto(nombre, datos); });
  } else mostrarTexto(nombre, datos);
}
function mostrarTexto(nombre, datos){
  var box = $('#g-x-res'); if (!box) return;
  box.innerHTML = '<p class="nota" style="margin:0">Desde esta vista no se puede descargar. Copiá el texto, pegalo en un archivo nuevo de texto y guardalo como <b>' + esc(nombre) + '</b>.</p><label class="campo"><span>' + esc(nombre) + '</span><textarea id="g-x-txt" readonly rows="8">' + esc(datos.replace(/^﻿/, '')) + '</textarea></label><button class="btn" type="button" id="g-x-cop">Copiar</button>';
  $('#g-x-cop').onclick = function(){ copiar(datos.replace(/^﻿/, ''), $('#g-x-txt')); };
}
function copiar(texto, el){
  try {
    navigator.clipboard.writeText(texto).then(function(){ toast('Copiado.'); }, function(){ selTxt(el); });
  } catch(e){ selTxt(el); }
}
function selTxt(el){
  if (!el) return;
  try { if (el.select){ el.focus(); el.select(); } else { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } } catch(e){}
  toast('Texto seleccionado: copialo con el menú del teléfono.');
}

/* ===== avisos ===== */
var tt = null;
function toast(msg){
  var t = $('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 3800);
}
function ocupado(on){
  var o = $('.ocupado');
  if (on && !o){ o = document.createElement('div'); o.className = 'ocupado'; o.innerHTML = '<div>Guardando…</div>'; document.body.appendChild(o); }
  else if (!on && o) o.remove();
}

/* ===== arranque ===== */
function usar(n){ try { return (window.claude && window.claude.use) ? window.claude.use(n).catch(function(){ return null; }) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } }
var INIT = MODO === 'api' ? iniciarAPI() : Promise.all([usar('artifact'), usar('user'), usar('downloads')]).then(function(r){
  ART = r[0]; DESC = r[2];
  var u = r[1];
  return (u ? u.canEdit().catch(function(){ return false; }) : Promise.resolve(false)).then(function(ce){
    esDocente = !!ce && !!ART && !VIEJA; puedeGuardar = esDocente;
  });
}).catch(function(){ puedeGuardar = false; esDocente = false; });

var h0 = (location.hash || '').replace('#', '');
var TABS = ['inventario', 'registrar', 'historial', 'docente'];
var pedida = TABS.indexOf(h0) >= 0 ? h0 : (TABS.indexOf(ls('mb_tab')) >= 0 ? ls('mb_tab') : 'inventario');
UI.tab = pedida; if (h0 === pedida) ls('mb_tab', pedida);
UI.donde = ls('mb_donde') === 'persona' ? 'persona' : 'lugar';
UI.secAbierta = ss('mb_sec');
PEND = revisarPendiente();
pintar();
INIT.then(function(){
  if (esDocente && pedida === 'docente') UI.tab = 'docente';
  var ae = document.activeElement, enForm = ae && ae.closest && ae.closest('form');
  if (enForm){ pintarNav(); botonModo(); }
  else { var y = window.scrollY; pintar(); window.scrollTo(0, y); }
});
if (MODO === 'api'){
  setInterval(refrescar, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refrescar(); });
}
})();
</script>
